name: peso_plan
description: Peso Plan — A native budget planner for iOS and Android.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.13.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.6.2

  # HTTP client
  dio: ^5.7.0

  # Local database (offline support)
  drift: ^2.23.1
  drift_flutter: ^0.2.3
  sqlite3_flutter_libs: ^0.5.27

  # Charts
  fl_chart: ^0.69.2

  # Push notifications
  firebase_core: ^3.9.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.1

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # Fonts
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.7
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  path_provider: ^2.1.5
  path: ^1.9.0
  connectivity_plus: ^6.1.2
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  csv: ^6.0.0
  crypto: ^3.0.6
  logger: ^2.5.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.17

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.23.0
  # riverpod_generator: deferred to Phase 2+
  # freezed: deferred to Phase 2+
  # json_serializable: deferred to Phase 2+
  mocktail: ^1.0.4
  mockito: ^5.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
